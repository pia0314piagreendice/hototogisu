<html lang="ja">
<head>

<style>
    body {
        font-family: 'Hiragino Mincho ProN', 'Yu Mincho', serif;
        background-color: #fdfaf5;
        color: #333;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        height: 100vh;
        height: 100dvh; 
        margin: 0;
        padding: 2vh 10px;
        box-sizing: border-box;
        overflow: hidden; 
        user-select: none;
        -webkit-user-select: none;
        touch-action: manipulation;
    }

    #title-area {
        flex-shrink: 0;
        font-size: min(10vw, 42px); 
        font-weight: bold;
        text-align: center;
        z-index: 10;
        background: #2c3e50;
        color: #fdfdfd;
        padding: 8px 30px 12px;
        border: 2px solid #d4af37;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
        position: relative;
        line-height: 1.2;
        margin-top: 2vh;
    }
    #title-area::before {
        content: '';
        position: absolute;
        top: 4px; left: 4px; right: 4px; bottom: 4px;
        border: 1px solid #d4af37;
        border-radius: 4px;
        pointer-events: none;
    }
    
    ruby { ruby-position: over; }
    
    #char-jo-wrapper { 
        position: relative; 
        display: inline-block; 
    }
    
    #char-onna, #char-kuchi {
        display: none;
        position: absolute;
        bottom: 0;
        transition: transform 0.5s;
    }
    #char-onna { left: 0; }
    
    #char-kuchi { 
        left: 50%;
        cursor: grab;
        z-index: 100;
        touch-action: none;
    }
    #char-kuchi:active { cursor: grabbing; }
    #char-kuchi::after {
        content: '';
        position: absolute;
        top: -20px; left: -20px; right: -20px; bottom: -20px;
    }

    #center-area {
        flex-grow: 1;
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
    }
    
    #bird {
        position: relative;
        width: min(60vw, 35vh, 260px);
        height: min(60vw, 35vh, 260px);
    }
    
    .bird-svg-container {
        width: 100%; height: 100%;
        pointer-events: none;
    }
    .bird-part {
        position: absolute; top: 0; left: 0;
        transition: transform 0.6s ease-out;
    }
    
    .bird-left { clip-path: polygon(0 0, 50% 0, 50% 100%, 0 100%); }
    .bird-right { clip-path: polygon(50% 0, 100% 0, 100% 100%, 50% 100%); }
    .cut-left { transform: translateX(-60px) rotate(-15deg); }
    .cut-right { transform: translateX(60px) rotate(15deg); }

    .singing-bird .beak-closed { display: none !important; }
    .singing-bird .beak-open { display: block !important; }

    #note {
        position: absolute;
        font-size: min(5vw, 22px);
        font-weight: bold;
        color: #ff4081;
        background: rgba(255, 255, 255, 0.95);
        border: 2px solid #ff4081;
        padding: 6px 12px;
        border-radius: 20px;
        top: -15px; right: -20%;
        opacity: 0;
        transition: opacity 0.5s, transform 0.5s;
        white-space: nowrap;
        box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    #note::after {
        content: ''; position: absolute;
        bottom: -8px; left: 20px;
        border-width: 8px 8px 0;
        border-style: solid;
        border-color: #ff4081 transparent transparent transparent;
        display: block; width: 0;
    }
    .singing {
        opacity: 1 !important;
        transform: translateY(-10px) rotate(5deg);
    }

    #kanji-naku {
        display: none;
        font-size: min(50vw, 25vh, 200px);
        font-weight: bold;
        background: linear-gradient(to bottom, #d4af37, #b8860b);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-shadow: 2px 2px 10px rgba(212, 175, 55, 0.4);
    }

    @keyframes combineAnim {
        0% { transform: scale(0.2); opacity: 0; filter: brightness(2); }
        60% { transform: scale(1.1); filter: brightness(1.5); }
        100% { transform: scale(1); opacity: 1; filter: brightness(1); }
    }

    #bottom-area {
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2vh;
        margin-bottom: 2vh;
    }
    
    #sword {
        width: min(30vw, 15vh, 130px);
        height: min(30vw, 15vh, 130px);
        cursor: grab;
        position: relative;
        z-index: 200;
        padding: 5px;
        transition: opacity 0.3s;
        touch-action: none;
    }
    #sword:active { cursor: grabbing; }

    #reset-btn {
        padding: 10px 30px;
        font-size: min(4vw, 16px);
        font-weight: bold;
        cursor: pointer;
        background-color: #4a4a4a;
        color: white;
        border: 2px solid #333;
        border-radius: 6px;
        box-shadow: 0 3px 5px rgba(0,0,0,0.3);
        transition: transform 0.1s;
    }
    #reset-btn:active { transform: scale(0.95); }

    #result-modal {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.6);
        display: flex;
        justify-content: center; align-items: center;
        z-index: 1000;
        opacity: 0; pointer-events: none;
        transition: opacity 0.3s ease;
    }
    #result-modal.show {
        opacity: 1; pointer-events: auto;
    }
    
    .modal-content {
        background: #fdfaf5;
        padding: 30px 40px;
        border-radius: 12px;
        text-align: center;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        border: 4px solid #d4af37;
        transform: scale(0.8);
        transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    #result-modal.show .modal-content { transform: scale(1); }
    .modal-title-text { font-size: 18px; color: #555; margin-bottom: 10px; }
    
    #modal-text {
        font-size: 32px;
        font-weight: bold;
        color: #d32f2f;
        margin-bottom: 25px;
        text-shadow: 1px 1px 3px rgba(0,0,0,0.2);
    }

    .modal-buttons {
        display: flex;
        justify-content: center;
        gap: 15px;
        margin-top: 10px;
    }
    #share-x-btn {
        background: #000; color: #fff;
        border: none; padding: 10px 20px;
        font-size: 16px; font-weight: bold;
        border-radius: 6px; cursor: pointer;
        box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        transition: transform 0.1s;
    }
    #share-x-btn:active { transform: scale(0.95); }
    #modal-close-btn {
        background: #2c3e50; color: #fff;
        border: none; padding: 10px 25px;
        font-size: 16px; font-weight: bold;
        border-radius: 6px; cursor: pointer;
        box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        transition: transform 0.1s;
    }
    #modal-close-btn:active { transform: scale(0.95); }

    @media screen and (max-width: 768px) {
        .modal-buttons { flex-direction: column; gap: 10px; }
    }
</style>

<script>
window.onload = function() {
    var WAIT_TIME = 120000; 

    var sword = document.getElementById('sword');
    var bird = document.getElementById('bird');
    var birdWhole = document.getElementById('bird-whole');
    var birdL = document.getElementById('bird-l');
    var birdR = document.getElementById('bird-r');
    var note = document.getElementById('note');
    var kanjiNaku = document.getElementById('kanji-naku');
    var charJo = document.getElementById('char-jo');
    var charOnna = document.getElementById('char-onna');
    var charKuchi = document.getElementById('char-kuchi');
    
    var resultModal = document.getElementById('result-modal');
    var modalText = document.getElementById('modal-text');
    var modalCloseBtn = document.getElementById('modal-close-btn');
    var shareXBtn = document.getElementById('share-x-btn');

    var gameActive = true;
    var timerId;

    function startIeyasuTimer() {
        timerId = setTimeout(function() {
            if (!gameActive) return;
            gameActive = false;
            birdWhole.classList.add('singing-bird');
            note.classList.add('singing');
            sword.style.opacity = '0'; 
            setTimeout(function() { sword.style.visibility = 'hidden'; }, 300);
            
            setTimeout(function() {
                showResult("家康");
            }, 1000);
        }, WAIT_TIME);
    }
    startIeyasuTimer();

    function showResult(type) {
        modalText.innerText = "あなたは" + type + "タイプ！";
        
        var shareText = "私は" + type + "タイプ！#ホトトギス診断\n";
        
        // ★ キャッシュ回避のため、結果ごとにURLの末尾にダミーパラメータ（?t=〇）を付与して別URLだと認識させる
        var typeId = "n";
        if (type === "秀吉") typeId = "h";
        if (type === "家康") typeId = "i";
        var shareUrl = "https://pia0314piagreendice.github.io/hototogisu/?t=" + typeId;
        
        var twitterIntentUrl = "https://twitter.com/intent/tweet?text=" + encodeURIComponent(shareText) + "&url=" + encodeURIComponent(shareUrl);
        
        shareXBtn.onclick = function() {
            window.open(twitterIntentUrl, '_blank');
        };

        resultModal.classList.add('show');
    }

    modalCloseBtn.addEventListener('click', function() {
        resultModal.classList.remove('show');
    });

    function isColliding(el1, el2, padding) {
        if (padding === undefined) padding = 20;
        var rect1 = el1.getBoundingClientRect();
        var rect2 = el2.getBoundingClientRect();
        return !(
            rect1.top + padding > rect2.bottom ||
            rect1.right - padding < rect2.left ||
            rect1.bottom - padding < rect2.top ||
            rect1.left + padding > rect2.right
        );
    }

    function makeDraggable(element, onDrop) {
        var currentX = 0, currentY = 0;
        var initialX, initialY;
        var isDragging = false;
        
        element.addEventListener('pointerdown', function(e) {
            if (!gameActive) return;
            isDragging = true;
            element.setPointerCapture(e.pointerId);
            element.style.transition = 'none';
            initialX = e.clientX - currentX;
            initialY = e.clientY - currentY;
            element.style.transform = "translate(" + currentX + "px, " + currentY + "px) scale(1.1)";
            element.style.zIndex = 1000;
        });

        element.addEventListener('pointermove', function(e) {
            if (!isDragging || !gameActive) return;
            currentX = e.clientX - initialX;
            currentY = e.clientY - initialY;
            element.style.transform = "translate(" + currentX + "px, " + currentY + "px) scale(1.1)";
        });

        element.addEventListener('pointerup', function(e) {
            if (!isDragging) return;
            isDragging = false;
            element.releasePointerCapture(e.pointerId);
            element.style.transition = 'opacity 0.3s'; 
            element.style.transform = "translate(" + currentX + "px, " + currentY + "px) scale(1)";
            if (gameActive && onDrop) {
                onDrop(element, currentX, currentY);
            }
        });
    }

    makeDraggable(sword, function(draggedElement) {
        if (isColliding(draggedElement, bird, 20)) {
            gameActive = false;
            clearTimeout(timerId);
            
            birdWhole.style.display = 'none';
            birdL.style.display = 'block';
            birdR.style.display = 'block';
            
            sword.style.opacity = '0';
            setTimeout(function() { sword.style.visibility = 'hidden'; }, 300);
            
            setTimeout(function() {
                birdL.classList.add('cut-left');
                birdR.classList.add('cut-right');
            }, 50);

            setTimeout(function() {
                showResult("信長");
            }, 1000);
        }
        else if (charJo.style.visibility !== 'hidden' && isColliding(draggedElement, charJo, 15)) {
            charJo.style.visibility = 'hidden';
            charOnna.style.display = 'inline-block';
            charKuchi.style.display = 'inline-block';
            
            sword.style.opacity = '0';
            setTimeout(function() { sword.style.visibility = 'hidden'; }, 300);
            
            setTimeout(function() {
                charOnna.style.transform = 'translateX(-25px) rotate(-15deg)';
                charKuchi.style.transform = 'translateX(25px) rotate(15deg)';
            }, 50);

            makeDraggable(charKuchi, function(draggedKuchi, curX, curY) {
                var bRect = bird.getBoundingClientRect();
                var kRect = draggedKuchi.getBoundingClientRect();
                
                var kCenterX = kRect.left + kRect.width / 2;
                var kCenterY = kRect.top + kRect.height / 2;
                var bCenterX = bRect.left + bRect.width / 2;
                var bCenterY = bRect.top + bRect.height / 2;

                var isLeft = kCenterX < bCenterX;
                var isNearX = (bCenterX - kCenterX) < 320; 
                var isNearY = Math.abs(bCenterY - kCenterY) < 220; 

                if (isLeft && isNearX && isNearY) {
                    gameActive = false;
                    clearTimeout(timerId);
                    
                    draggedKuchi.style.transition = 'transform 0.4s ease-in, opacity 0.4s ease-in';
                    birdWhole.style.transition = 'transform 0.4s ease-in, opacity 0.4s ease-in';
                    
                    var moveX = (bRect.left + bRect.width * 0.15) - kRect.left;
                    var moveY = (bRect.top + bRect.height * 0.5 - kRect.height / 2) - kRect.top;
                    
                    curX += moveX;
                    curY += moveY;
                    
                    draggedKuchi.style.transform = "translate(" + curX + "px, " + curY + "px) scale(1.5)";
                    draggedKuchi.style.opacity = '0';
                    
                    birdWhole.style.transform = 'translateX(20px) scale(0.9)';
                    birdWhole.style.opacity = '0';
                    
                    setTimeout(function() {
                        draggedKuchi.style.display = 'none';
                        bird.style.display = 'none';
                        kanjiNaku.style.display = 'block';
                        kanjiNaku.style.animation = 'combineAnim 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards';
                        
                        setTimeout(function() {
                            showResult("秀吉");
                        }, 1600);
                    }, 400); 
                }
            });
        }
    });
};
</script>
