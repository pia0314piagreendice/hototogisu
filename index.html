<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>不如帰診断</title>
<style>
    body {
        font-family: 'Hiragino Mincho ProN', 'Yu Mincho', serif;
        background-color: #fdfaf5;
        color: #333;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        gap: 20px;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
    }

    #title-area {
        /* フォントサイズを28pxから1.5倍の42pxに拡大 */
        font-size: 42px;
        font-weight: bold;
        text-align: center;
        z-index: 10;
        background: #2c3e50;
        color: #fdfdfd;
        /* 文字の拡大に合わせて枠の余白も少し調整 */
        padding: 15px 40px;
        border: 2px solid #d4af37;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
        position: relative;
        margin-bottom: 15px;
    }
    #title-area::before {
        content: '';
        position: absolute;
        top: 4px; left: 4px; right: 4px; bottom: 4px;
        border: 1px solid #d4af37;
        border-radius: 4px;
        pointer-events: none;
    }
    
    ruby { ruby-position: over; }
    #char-jo-wrapper { position: relative; display: inline-block; }
    #char-jo { display: inline-block; }
    
    #char-onna, #char-kuchi {
        display: none;
        position: absolute;
        top: 0;
        transition: transform 0.5s;
    }
    #char-onna { left: 0; }
    #char-kuchi { 
        left: 50%;
        cursor: grab;
        z-index: 100;
        color: #ff5252;
        text-shadow: 0 0 10px rgba(255, 82, 82, 0.8);
        padding: 20px;
        margin: -20px; 
    }
    #char-kuchi:active { cursor: grabbing; }

    #center-area {
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
    }
    #bird {
        position: relative;
        width: 180px;
        height: 180px;
    }
    
    .bird-svg-container {
        width: 100%; height: 100%;
        pointer-events: none;
    }
    .bird-part {
        position: absolute; top: 0; left: 0;
        transition: transform 0.6s ease-out, opacity 0.6s;
    }
    
    .bird-left { clip-path: polygon(0 0, 50% 0, 50% 100%, 0 100%); }
    .bird-right { clip-path: polygon(50% 0, 100% 0, 100% 100%, 50% 100%); }
    .cut-left { transform: translateX(-50px) rotate(-15deg); opacity: 0; }
    .cut-right { transform: translateX(50px) rotate(15deg); opacity: 0; }

    .singing-bird .beak-closed { display: none !important; }
    .singing-bird .beak-open { display: block !important; }

    #note {
        position: absolute;
        font-size: 16px;
        font-weight: bold;
        color: #ff4081;
        background: rgba(255, 255, 255, 0.95);
        border: 2px solid #ff4081;
        padding: 6px 10px;
        border-radius: 20px;
        top: -10px; right: -50px;
        opacity: 0;
        transition: opacity 0.5s, transform 0.5s;
        white-space: nowrap;
        box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    #note::after {
        content: ''; position: absolute;
        bottom: -8px; left: 20px;
        border-width: 8px 8px 0;
        border-style: solid;
        border-color: #ff4081 transparent transparent transparent;
        display: block; width: 0;
    }
    .singing {
        opacity: 1 !important;
        transform: translateY(-10px) rotate(5deg);
    }

    #kanji-naku {
        display: none;
        font-size: 140px;
        font-weight: bold;
        background: linear-gradient(to bottom, #d4af37, #b8860b);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-shadow: 2px 2px 10px rgba(212, 175, 55, 0.4);
    }

    #bottom-area {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        z-index: 50;
        margin-top: 10px;
    }
    
    #sword {
        width: 94px;
        height: 94px;
        cursor: grab;
        position: relative;
        z-index: 200;
        padding: 5px;
    }
    #sword:active { cursor: grabbing; }

    #reset-btn {
        padding: 10px 30px;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
        background-color: #4a4a4a;
        color: white;
        border: 2px solid #333;
        border-radius: 6px;
        box-shadow: 0 3px 5px rgba(0,0,0,0.3);
        transition: background-color 0.2s, transform 0.1s;
    }
    #reset-btn:active { transform: scale(0.95); }

    #result-modal {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.6);
        display: flex;
        justify-content: center; align-items: center;
        z-index: 1000;
        opacity: 0; pointer-events: none;
        transition: opacity 0.3s ease;
    }
    #result-modal.show {
        opacity: 1; pointer-events: auto;
    }
    
    .modal-content {
        background: #fdfaf5;
        padding: 30px 40px;
        border-radius: 12px;
        text-align: center;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        border: 4px solid #d4af37;
        transform: scale(0.8);
        transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    #result-modal.show .modal-content { transform: scale(1); }

    .modal-title-text { font-size: 18px; color: #555; margin-bottom: 10px; }
    
    #modal-text {
        font-size: 32px;
        font-weight: bold;
        color: #d32f2f;
        margin-bottom: 25px;
        text-shadow: 1px 1px 3px rgba(0,0,0,0.2);
    }

    #modal-close-btn {
        background: #2c3e50; color: #fff;
        border: none; padding: 10px 25px;
        font-size: 16px; font-weight: bold;
        border-radius: 6px; cursor: pointer;
        box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    #modal-close-btn:active { transform: scale(0.95); }
</style>
</head>
<body>

    <div id="title-area">
        <ruby>不<rt>ホト</rt></ruby><span id="char-jo-wrapper"><span id="char-jo"><ruby>如<rt>トギ</rt></ruby></span><span id="char-onna">女</span><span id="char-kuchi">口</span></span><ruby>帰<rt>ス</rt></ruby>診断
    </div>

    <div id="center-area">
        <div id="bird">
            <div id="bird-whole" class="bird-svg-container"></div>
            <div id="bird-l" class="bird-svg-container bird-part bird-left" style="display:none;"></div>
            <div id="bird-r" class="bird-svg-container bird-part bird-right" style="display:none;"></div>
            <div id="note">ホーホケキョ♪</div>
        </div>
        <div id="kanji-naku">鳴</div>
    </div>

    <div id="bottom-area">
        <div id="sword">
            <svg viewBox="0 0 200 200" width="100%" height="100%" style="filter: drop-shadow(3px 3px 4px rgba(0,0,0,0.4));">
                <defs>
                    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#ffffff"/>
                        <stop offset="40%" stop-color="#cbd5e1"/>
                        <stop offset="100%" stop-color="#64748b"/>
                    </linearGradient>
                </defs>
                <g transform="translate(35, 165) rotate(-45)">
                    <rect x="0" y="-5" width="45" height="10" fill="#f8f9fa"/>
                    <path d="M0,-5 l5,10 m5,-10 l5,10 m5,-10 l5,10 m5,-10 l5,10 m5,-10 l5,10 m5,-10 l5,10 m5,-10 l5,10 m5,-10 l5,10" stroke="#111" stroke-width="1.5"/>
                    <path d="M5,-5 l-5,10 m10,-10 l-5,10 m10,-10 l-5,10 m10,-10 l-5,10 m10,-10 l-5,10 m10,-10 l-5,10 m10,-10 l-5,10 m10,-10 l-5,10" stroke="#111" stroke-width="1.5"/>
                    <rect x="-4" y="-6" width="4" height="12" fill="#222" rx="1"/>
                    <rect x="45" y="-12" width="4" height="24" fill="#222" stroke="#d4af37" stroke-width="1" rx="1"/>
                    <rect x="49" y="-5" width="6" height="10" fill="#d4af37"/>
                    <path d="M 55 -5 Q 120 -15 180 -5 Q 192 -1 192 4 Q 120 -5 55 5 Z" fill="url(#bladeGrad)"/>
                    <path d="M 55 0 Q 120 -7 185 -1" stroke="#94a3b8" stroke-width="0.5" fill="none"/>
                    <path d="M 55 2 Q 70 0 80 3 T 110 1 T 140 3 T 170 2" stroke="#fff" stroke-width="1.5" fill="none" opacity="0.8"/>
                </g>
            </svg>
        </div>
        <button id="reset-btn" onclick="location.reload()">最初からやり直す</button>
    </div>

    <div id="result-modal">
        <div class="modal-content">
            <div class="modal-title-text">＼ 診断結果 ／</div>
            <div id="modal-text">あなたは〇〇タイプ！</div>
            <button id="modal-close-btn">閉じる</button>
        </div>
    </div>

<script>
    const WAIT_TIME = 120000;

    const birdSVG = `
    <svg viewBox="0 0 200 200" width="100%" height="100%">
        <defs>
            <clipPath id="birdClip">
                <path d="M 45 80 C 50 45, 80 40, 100 50 C 120 60, 140 80, 155 95 C 130 135, 80 150, 45 125 C 30 110, 35 90, 45 80 Z" />
            </clipPath>
        </defs>
        <path d="M 140 90 L 195 115 L 185 130 L 130 110 Z" fill="#444d56"/>
        <path d="M 145 100 L 195 125 L 185 135 L 135 115 Z" fill="#363c43"/>
        <path d="M 80 140 L 75 170 L 65 175 M 75 170 L 85 175" stroke="#d49a2a" stroke-width="3" fill="none" stroke-linecap="round"/>
        <path d="M 100 135 L 95 165 L 85 170 M 95 165 L 105 170" stroke="#d49a2a" stroke-width="3" fill="none" stroke-linecap="round"/>
        <path d="M 45 80 C 50 45, 80 40, 100 50 C 120 60, 140 80, 155 95 C 130 135, 80 150, 45 125 C 30 110, 35 90, 45 80 Z" fill="#ffffff"/>
        <g clip-path="url(#birdClip)">
            <path d="M 30 95 Q 80 120 150 95" stroke="#333" stroke-width="2.5" fill="none"/>
            <path d="M 30 105 Q 80 130 150 105" stroke="#333" stroke-width="2.5" fill="none"/>
            <path d="M 30 115 Q 80 140 150 115" stroke="#333" stroke-width="2.5" fill="none"/>
            <path d="M 30 125 Q 80 150 150 125" stroke="#333" stroke-width="2.5" fill="none"/>
            <path d="M 40 135 Q 80 160 140 135" stroke="#333" stroke-width="2.5" fill="none"/>
        </g>
        <path d="M 45 80 C 50 45, 80 40, 100 50 C 120 60, 140 80, 155 95 C 130 90, 90 85, 45 80 Z" fill="#6c7782"/>
        <path d="M 90 75 C 110 75, 135 95, 150 120 C 125 110, 100 95, 90 75 Z" fill="#525b64"/>
        <circle cx="60" cy="65" r="3.5" fill="#111"/>
        <circle cx="60" cy="65" r="5" fill="none" stroke="#f1c40f" stroke-width="2"/>
        <path class="beak-closed" d="M 45 72 L 15 76 L 45 82 Z" fill="#333"/>
        <path class="beak-open" d="M 45 72 L 15 62 L 38 75 Z M 45 82 L 15 92 L 40 80 Z" fill="#333" style="display:none;"/>
        <path class="beak-open" d="M 38 75 L 15 77 L 40 80 Z" fill="#c0392b" style="display:none;"/>
    </svg>
    `;
    
    document.getElementById('bird-whole').innerHTML = birdSVG;
    document.getElementById('bird-l').innerHTML = birdSVG;
    document.getElementById('bird-r').innerHTML = birdSVG;

    const sword = document.getElementById('sword');
    const bird = document.getElementById('bird');
    const birdWhole = document.getElementById('bird-whole');
    const birdL = document.getElementById('bird-l');
    const birdR = document.getElementById('bird-r');
    const note = document.getElementById('note');
    const kanjiNaku = document.getElementById('kanji-naku');
    const charJo = document.getElementById('char-jo');
    const charOnna = document.getElementById('char-onna');
    const charKuchi = document.getElementById('char-kuchi');
    
    const resultModal = document.getElementById('result-modal');
    const modalText = document.getElementById('modal-text');
    const modalCloseBtn = document.getElementById('modal-close-btn');

    let gameActive = true;
    let timerId;

    function startIeyasuTimer() {
        timerId = setTimeout(() => {
            if (!gameActive) return;
            gameActive = false;
            birdWhole.classList.add('singing-bird');
            note.classList.add('singing');
            sword.style.visibility = 'hidden'; 
            
            setTimeout(() => {
                showResult("あなたは家康タイプ！");
            }, 1000);
        }, WAIT_TIME);
    }
    startIeyasuTimer();

    function showResult(text) {
        modalText.innerText = text;
        resultModal.classList.add('show');
    }

    modalCloseBtn.addEventListener('click', () => {
        resultModal.classList.remove('show');
    });

    function isColliding(el1, el2) {
        const rect1 = el1.getBoundingClientRect();
        const rect2 = el2.getBoundingClientRect();
        const padding = 15; 
        return !(
            rect1.top + padding > rect2.bottom ||
            rect1.right - padding < rect2.left ||
            rect1.bottom - padding < rect2.top ||
            rect1.left + padding > rect2.right
        );
    }

    function makeDraggable(element, onDrop) {
        let currentX = 0, currentY = 0;
        let initialX, initialY;
        let isDragging = false;
        
        element.addEventListener('pointerdown', (e) => {
            if (!gameActive) return;
            isDragging = true;
            element.setPointerCapture(e.pointerId);
            element.style.transition = 'none';
            initialX = e.clientX - currentX;
            initialY = e.clientY - currentY;
            element.style.transform = `translate(${currentX}px, ${currentY}px) scale(1.1)`;
            element.style.zIndex = 1000;
        });

        element.addEventListener('pointermove', (e) => {
            if (!isDragging || !gameActive) return;
            currentX = e.clientX - initialX;
            currentY = e.clientY - initialY;
            element.style.transform = `translate(${currentX}px, ${currentY}px) scale(1.1)`;
        });

        element.addEventListener('pointerup', (e) => {
            if (!isDragging) return;
            isDragging = false;
            element.releasePointerCapture(e.pointerId);
            element.style.transition = '';
            element.style.transform = `translate(${currentX}px, ${currentY}px) scale(1)`;
            if (gameActive && onDrop) {
                onDrop(element);
            }
        });
    }

    makeDraggable(sword, (draggedElement) => {
        if (isColliding(draggedElement, bird)) {
            gameActive = false;
            clearTimeout(timerId);
            
            birdWhole.style.display = 'none';
            birdL.style.display = 'block';
            birdR.style.display = 'block';
            sword.style.visibility = 'hidden'; 
            
            setTimeout(() => {
                birdL.classList.add('cut-left');
                birdR.classList.add('cut-right');
            }, 50);

            setTimeout(() => {
                showResult("あなたは信長タイプ！");
            }, 1000);
        }
        else if (charJo.style.visibility !== 'hidden' && isColliding(draggedElement, charJo)) {
            charJo.style.visibility = 'hidden';
            charOnna.style.display = 'inline-block';
            charKuchi.style.display = 'inline-block';
            
            setTimeout(() => {
                charOnna.style.transform = 'translateX(-20px) rotate(-15deg)';
                charKuchi.style.transform = 'translateX(20px) rotate(15deg)';
            }, 50);

            makeDraggable(charKuchi, (draggedKuchi) => {
                if (isColliding(draggedKuchi, bird)) {
                    gameActive = false;
                    clearTimeout(timerId);
                    
                    draggedKuchi.style.display = 'none';
                    bird.style.display = 'none';
                    kanjiNaku.style.display = 'block';
                    sword.style.visibility = 'hidden';
                    
                    setTimeout(() => {
                        showResult("あなたは秀吉タイプ！");
                    }, 1000);
                }
            });
        }
    });
</script>
</body>
</html>
