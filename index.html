<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>不如帰診断</title>
<style>
    body {
        font-family: 'Hiragino Mincho ProN', 'Yu Mincho', serif;
        background-color: #fdfaf5;
        color: #333;
        display: flex;
        flex-direction: column;
        align-items: center;
        height: 100vh;
        margin: 0;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none; /* スマホでのスワイプスクロールを防止 */
    }

    /* 上部：タイトル */
    #title-area {
        margin-top: 10vh;
        font-size: 32px;
        font-weight: bold;
        text-align: center;
        z-index: 10;
    }
    ruby {
        ruby-position: over;
    }
    #char-jo-wrapper {
        position: relative;
        display: inline-block;
    }
    #char-jo {
        display: inline-block;
    }
    
    /* 切られた後の「女」と「口」 */
    #char-onna, #char-kuchi {
        display: none;
        position: absolute;
        top: 0;
        transition: transform 0.5s; /* 分割時のアニメーション */
    }
    #char-onna { left: 0; }
    #char-kuchi { 
        left: 50%;
        cursor: grab;
        z-index: 100;
        color: #d32f2f;
        padding: 20px;
        margin: -20px; /* ドラッグしやすくするための余白 */
    }
    #char-kuchi:active { cursor: grabbing; }

    /* 中央：ホトトギスエリア */
    #center-area {
        flex-grow: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        width: 100%;
    }
    #bird {
        position: relative;
        width: 200px;
        height: 200px;
    }
    
    /* 鳥のSVGコンテナ */
    .bird-svg-container {
        width: 100%;
        height: 100%;
        pointer-events: none;
    }
    .bird-part {
        position: absolute;
        top: 0;
        left: 0;
        transition: transform 0.6s ease-out, opacity 0.6s;
    }
    
    /* ホトトギスを左右に分割するクリップパス */
    .bird-left { clip-path: polygon(0 0, 50% 0, 50% 100%, 0 100%); }
    .bird-right { clip-path: polygon(50% 0, 100% 0, 100% 100%, 50% 100%); }
    .cut-left { transform: translateX(-50px) rotate(-15deg); opacity: 0; }
    .cut-right { transform: translateX(50px) rotate(15deg); opacity: 0; }

    /* 鳴き声とクチバシの開閉設定 */
    .singing-bird .beak-closed { display: none !important; }
    .singing-bird .beak-open { display: block !important; }

    #note {
        position: absolute;
        font-size: 18px;
        font-weight: bold;
        color: #ff4081;
        background: rgba(255, 255, 255, 0.95);
        border: 2px solid #ff4081;
        padding: 8px 12px;
        border-radius: 20px;
        top: -10px;
        right: -80px;
        opacity: 0;
        transition: opacity 0.5s, transform 0.5s;
        white-space: nowrap;
        box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    #note::after {
        content: '';
        position: absolute;
        bottom: -8px;
        left: 20px;
        border-width: 8px 8px 0;
        border-style: solid;
        border-color: #ff4081 transparent transparent transparent;
        display: block;
        width: 0;
    }
    .singing {
        opacity: 1 !important;
        transform: translateY(-15px) rotate(5deg);
    }

    #kanji-naku {
        display: none;
        font-size: 120px;
        font-weight: bold;
        color: #333;
        text-shadow: 2px 2px 5px rgba(0,0,0,0.2);
    }

    /* 下部：刀とリセットボタン */
    #bottom-area {
        position: absolute;
        bottom: 5vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        width: 100%;
        z-index: 50;
    }
    #sword {
        width: 120px;
        height: 120px;
        cursor: grab;
        position: relative;
        z-index: 200;
        padding: 20px; /* スマホでタッチしやすくする */
        margin: -20px;
    }
    #sword:active {
        cursor: grabbing;
    }

    #reset-btn {
        padding: 12px 30px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        background-color: #555;
        color: white;
        border: none;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        transition: background-color 0.2s, transform 0.1s;
    }
    #reset-btn:active { transform: scale(0.95); }

    /* 結果表示 */
    #result-text {
        position: absolute;
        top: 30%;
        font-size: 36px;
        font-weight: bold;
        color: #d32f2f;
        opacity: 0;
        transition: opacity 1s;
        pointer-events: none;
        text-shadow: 2px 2px 5px rgba(255,255,255,0.9), 0 0 10px rgba(255,255,255,0.9);
        z-index: 300;
        width: 100%;
        text-align: center;
    }
</style>
</head>
<body>

    <div id="title-area">
        <ruby>不<rt>ホト</rt></ruby><span id="char-jo-wrapper"><span id="char-jo"><ruby>如<rt>トギ</rt></ruby></span><span id="char-onna">女</span><span id="char-kuchi">口</span></span><ruby>帰<rt>ス</rt></ruby>診断
    </div>

    <div id="center-area">
        <div id="bird">
            <div id="bird-whole" class="bird-svg-container"></div>
            <div id="bird-l" class="bird-svg-container bird-part bird-left" style="display:none;"></div>
            <div id="bird-r" class="bird-svg-container bird-part bird-right" style="display:none;"></div>
            <div id="note">ホーホケキョ♪</div>
        </div>
        <div id="kanji-naku">鳴</div>
    </div>

    <div id="result-text"></div>

    <div id="bottom-area">
        <div id="sword">
            <!-- 日本刀のベクターイラスト（SVG） -->
            <svg viewBox="0 0 200 200" width="100%" height="100%" style="filter: drop-shadow(3px 3px 4px rgba(0,0,0,0.4));">
                <g transform="translate(100, 100) rotate(-45) translate(-100, -100)">
                    <!-- 柄（つか） -->
                    <rect x="94" y="110" width="12" height="45" rx="2" fill="#1a1a1a"/>
                    <!-- 柄巻（つかまき：ひし形模様） -->
                    <path d="M 94 115 L 106 120 M 94 125 L 106 130 M 94 135 L 106 140 M 94 145 L 106 150" stroke="#DAA520" stroke-width="1.5" />
                    <!-- 鍔（つば） -->
                    <rect x="88" y="106" width="24" height="5" rx="1" fill="#333" stroke="#DAA520" stroke-width="1"/>
                    <!-- 鎺（はばき） -->
                    <rect x="95" y="98" width="10" height="8" fill="#DAA520"/>
                    <!-- 刀身（刃） -->
                    <path d="M 95 98 Q 105 40 105 10 Q 112 40 105 98 Z" fill="#E2E8F0"/>
                    <!-- 刃文・しのぎ -->
                    <path d="M 95 98 Q 105 40 105 10" stroke="#FFF" stroke-width="2" fill="none"/>
                    <path d="M 101 98 Q 108 40 105 10" stroke="#CBD5E1" stroke-width="1" fill="none"/>
                </g>
            </svg>
        </div>
        <button id="reset-btn" onclick="location.reload()">リセット</button>
    </div>

<script>
    // ===== ゲーム設定 =====
    const WAIT_TIME = 120000; // 2分 (テスト時は5000などに変更してください)

    // ===== ホトトギスのベクターイラストを生成 =====
    // ※画像が壊れないように、直接コードで絵を描画します
    const birdSVG = `
    <svg viewBox="0 0 200 200" width="100%" height="100%">
        <g transform="translate(10, 15)">
            <!-- 尾羽 -->
            <path d="M 130 110 Q 170 150 180 170 Q 150 160 110 140 Z" fill="#5A636A"/>
            <!-- お腹 -->
            <ellipse cx="90" cy="110" rx="45" ry="35" fill="#f4f4f4" />
            <path d="M 65 125 Q 90 135 115 125 M 60 135 Q 90 145 120 135" stroke="#444" stroke-width="2" fill="none" stroke-linecap="round"/>
            <!-- 背中・頭 -->
            <path d="M 120 130 C 130 70 90 50 60 60 C 40 66 40 85 50 100 C 70 110 100 140 120 130 Z" fill="#5A636A"/>
            <!-- 目 -->
            <circle cx="60" cy="75" r="4.5" fill="#111"/>
            <circle cx="60" cy="75" r="7" fill="none" stroke="#F39C12" stroke-width="2"/>
            <!-- 翼 -->
            <path d="M 85 85 C 110 85 125 110 105 130 C 85 120 75 100 85 85 Z" fill="#40484D"/>
            <!-- 足 -->
            <path d="M 80 143 L 70 175 M 100 143 L 105 175" stroke="#F39C12" stroke-width="3" stroke-linecap="round"/>
            <path d="M 65 175 L 75 175 M 100 175 L 110 175" stroke="#F39C12" stroke-width="3" stroke-linecap="round"/>
            
            <!-- クチバシ（閉） -->
            <path class="beak-closed" d="M 45 75 L 10 78 L 45 83 Z" fill="#222" stroke="#222" stroke-linejoin="round"/>
            <!-- クチバシ（開：歌う時のみ表示） -->
            <path class="beak-open" d="M 45 73 L 10 60 L 40 77 Z M 45 83 L 10 95 L 40 81 Z" fill="#222" stroke="#222" stroke-linejoin="round" style="display:none;"/>
        </g>
    </svg>
    `;
    
    // 鳥のイラストをそれぞれの要素に流し込む
    document.getElementById('bird-whole').innerHTML = birdSVG;
    document.getElementById('bird-l').innerHTML = birdSVG;
    document.getElementById('bird-r').innerHTML = birdSVG;

    // ===== 要素の取得 =====
    const sword = document.getElementById('sword');
    const bird = document.getElementById('bird');
    const birdWhole = document.getElementById('bird-whole');
    const birdL = document.getElementById('bird-l');
    const birdR = document.getElementById('bird-r');
    const note = document.getElementById('note');
    const kanjiNaku = document.getElementById('kanji-naku');
    const charJo = document.getElementById('char-jo');
    const charOnna = document.getElementById('char-onna');
    const charKuchi = document.getElementById('char-kuchi');
    const resultText = document.getElementById('result-text');

    let gameActive = true;
    let timerId;

    // 家康タイマーの開始
    function startIeyasuTimer() {
        timerId = setTimeout(() => {
            if (!gameActive) return;
            gameActive = false;
            
            // クチバシを開いて鳴く演出
            birdWhole.classList.add('singing-bird');
            note.classList.add('singing');
            showResult("あなたは家康タイプ！");
        }, WAIT_TIME);
    }
    startIeyasuTimer();

    // 結果表示関数
    function showResult(text) {
        resultText.innerText = text;
        resultText.style.opacity = 1;
        sword.style.visibility = 'hidden'; 
    }

    // 重なり判定関数
    function isColliding(el1, el2) {
        const rect1 = el1.getBoundingClientRect();
        const rect2 = el2.getBoundingClientRect();
        const padding = 20;
        return !(
            rect1.top + padding > rect2.bottom ||
            rect1.right - padding < rect2.left ||
            rect1.bottom - padding < rect2.top ||
            rect1.left + padding > rect2.right
        );
    }

    // ドラッグ＆ドロップ機能
    function makeDraggable(element, onDrop) {
        let currentX = 0, currentY = 0;
        let initialX, initialY;
        let isDragging = false;
        
        element.addEventListener('pointerdown', (e) => {
            if (!gameActive) return;
            isDragging = true;
            element.setPointerCapture(e.pointerId);
            
            // ★ポイント: ドラッグ遅延を解消するため、掴んだ瞬間にアニメーション(transition)をオフにする
            element.style.transition = 'none';

            initialX = e.clientX - currentX;
            initialY = e.clientY - currentY;
            
            element.style.transform = `translate(${currentX}px, ${currentY}px) scale(1.2)`;
            element.style.zIndex = 1000;
        });

        element.addEventListener('pointermove', (e) => {
            if (!isDragging || !gameActive) return;
            currentX = e.clientX - initialX;
            currentY = e.clientY - initialY;
            element.style.transform = `translate(${currentX}px, ${currentY}px) scale(1.2)`;
        });

        element.addEventListener('pointerup', (e) => {
            if (!isDragging) return;
            isDragging = false;
            element.releasePointerCapture(e.pointerId);
            
            // アニメーション設定を元に戻す
            element.style.transition = '';
            
            element.style.transform = `translate(${currentX}px, ${currentY}px) scale(1)`;
            if (gameActive && onDrop) {
                onDrop(element);
            }
        });
    }

    // 刀のドラッグ設定
    makeDraggable(sword, (draggedElement) => {
        // 1. ホトトギスを斬る（信長）
        if (isColliding(draggedElement, bird)) {
            gameActive = false;
            clearTimeout(timerId);
            
            birdWhole.style.display = 'none';
            birdL.style.display = 'block';
            birdR.style.display = 'block';
            
            setTimeout(() => {
                birdL.classList.add('cut-left');
                birdR.classList.add('cut-right');
            }, 50);

            showResult("あなたは信長タイプ！");
        }
        
        // 2. 「如」を斬る（秀吉への準備）
        else if (charJo.style.display !== 'none' && isColliding(draggedElement, charJo)) {
            charJo.style.display = 'none';
            charOnna.style.display = 'inline-block';
            charKuchi.style.display = 'inline-block';
            
            // 斬られたときに少しズレる演出
            setTimeout(() => {
                charOnna.style.transform = 'translateX(-15px) rotate(-15deg)';
                charKuchi.style.transform = 'translateX(15px) rotate(15deg)';
            }, 50);

            // 分割された「口」をドラッグ可能にする
            makeDraggable(charKuchi, (draggedKuchi) => {
                if (isColliding(draggedKuchi, bird)) {
                    gameActive = false;
                    clearTimeout(timerId);
                    
                    draggedKuchi.style.display = 'none';
                    bird.style.display = 'none';
                    kanjiNaku.style.display = 'block';
                    
                    showResult("あなたは秀吉タイプ！");
                }
            });
        }
    });
</script>
</body>
</html>
