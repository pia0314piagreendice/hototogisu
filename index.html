<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>不如帰診断</title>
<style>
    body {
        font-family: 'Hiragino Mincho ProN', 'Yu Mincho', serif;
        background-color: #fdfaf5;
        color: #333;
        display: flex;
        flex-direction: column;
        align-items: center;
        height: 100vh;
        margin: 0;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none; /* スマホでのスワイプスクロールを防止 */
    }

    /* 上部：タイトル */
    #title-area {
        margin-top: 10vh;
        font-size: 32px;
        font-weight: bold;
        text-align: center;
        z-index: 10;
    }
    ruby {
        ruby-position: over;
    }
    #char-jo-wrapper {
        position: relative;
        display: inline-block;
    }
    #char-jo {
        display: inline-block;
    }
    /* 切られた後の「女」と「口」 */
    #char-onna, #char-kuchi {
        display: none;
        position: absolute;
        top: 0;
        transition: transform 0.5s;
    }
    #char-onna { left: 0; }
    #char-kuchi { 
        left: 50%;
        cursor: grab;
        z-index: 100;
        color: #d32f2f;
        padding: 10px;
        margin: -10px; /* ドラッグしやすくするための余白 */
    }
    #char-kuchi:active { cursor: grabbing; }

    /* 中央：ホトトギスエリア */
    #center-area {
        flex-grow: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        width: 100%;
    }
    #bird {
        position: relative;
        width: 180px;
        height: 180px;
    }
    #bird img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 15px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        pointer-events: none;
    }
    .bird-part {
        position: absolute;
        top: 0;
        left: 0;
        transition: transform 0.6s ease-out, opacity 0.6s;
    }
    .bird-left { clip-path: polygon(0 0, 50% 0, 50% 100%, 0 100%); }
    .bird-right { clip-path: polygon(50% 0, 100% 0, 100% 100%, 50% 100%); }
    
    .cut-left { transform: translateX(-60px) rotate(-15deg); opacity: 0; }
    .cut-right { transform: translateX(60px) rotate(15deg); opacity: 0; }

    /* 鳴き声の吹き出し */
    #note {
        position: absolute;
        font-size: 18px;
        font-weight: bold;
        color: #ff4081;
        background: rgba(255, 255, 255, 0.95);
        border: 2px solid #ff4081;
        padding: 8px 12px;
        border-radius: 20px;
        top: -30px;
        right: -90px;
        opacity: 0;
        transition: opacity 0.5s, transform 0.5s;
        white-space: nowrap;
        box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    #note::after {
        content: '';
        position: absolute;
        bottom: -8px;
        left: 20px;
        border-width: 8px 8px 0;
        border-style: solid;
        border-color: #ff4081 transparent transparent transparent;
        display: block;
        width: 0;
    }
    .singing {
        opacity: 1 !important;
        transform: translateY(-10px) rotate(5deg);
    }

    #kanji-naku {
        display: none;
        font-size: 120px;
        font-weight: bold;
        color: #333;
        text-shadow: 2px 2px 5px rgba(0,0,0,0.2);
    }

    /* 下部：刀とリセットボタン */
    #bottom-area {
        position: absolute;
        bottom: 5vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        width: 100%;
        z-index: 50;
    }
    #sword {
        font-size: 70px;
        cursor: grab;
        position: relative;
        z-index: 200;
        filter: drop-shadow(2px 2px 3px rgba(0,0,0,0.3));
        padding: 20px;
        margin: -20px; /* スマホでタッチしやすくする */
    }
    #sword:active {
        cursor: grabbing;
    }

    #reset-btn {
        padding: 12px 30px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        background-color: #555;
        color: white;
        border: none;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        transition: background-color 0.2s, transform 0.1s;
    }
    #reset-btn:active { transform: scale(0.95); }

    /* 結果表示 */
    #result-text {
        position: absolute;
        top: 30%;
        font-size: 36px;
        font-weight: bold;
        color: #d32f2f;
        opacity: 0;
        transition: opacity 1s;
        pointer-events: none;
        text-shadow: 2px 2px 5px rgba(255,255,255,0.9), 0 0 10px rgba(255,255,255,0.9);
        z-index: 300;
        width: 100%;
        text-align: center;
    }
</style>
</head>
<body>

    <div id="title-area">
        <ruby>不<rt>ホト</rt></ruby><span id="char-jo-wrapper"><span id="char-jo"><ruby>如<rt>トギ</rt></ruby></span><span id="char-onna">女</span><span id="char-kuchi">口</span></span><ruby>帰<rt>ス</rt></ruby>診断
    </div>

    <div id="center-area">
        <div id="bird">
            <!-- 安定して表示される高画質の鳥のフリー素材 -->
            <img id="bird-whole" src="https://images.unsplash.com/photo-1552728089-57105a8e7ce5?auto=format&fit=crop&w=300&q=80" alt="ホトトギス">
            <img class="bird-part bird-left" id="bird-l" src="https://images.unsplash.com/photo-1552728089-57105a8e7ce5?auto=format&fit=crop&w=300&q=80" style="display:none;" alt="ホトトギス左半身">
            <img class="bird-part bird-right" id="bird-r" src="https://images.unsplash.com/photo-1552728089-57105a8e7ce5?auto=format&fit=crop&w=300&q=80" style="display:none;" alt="ホトトギス右半身">
            <div id="note">ホーホケキョ♪</div>
        </div>
        <div id="kanji-naku">鳴</div>
    </div>

    <div id="result-text"></div>

    <div id="bottom-area">
        <div id="sword">🗡️</div>
        <button id="reset-btn" onclick="location.reload()">リセット</button>
    </div>

<script>
    // ===== ゲーム設定 =====
    const WAIT_TIME = 120000; // 2分

    // ===== 要素の取得 =====
    const sword = document.getElementById('sword');
    const bird = document.getElementById('bird');
    const birdWhole = document.getElementById('bird-whole');
    const birdL = document.getElementById('bird-l');
    const birdR = document.getElementById('bird-r');
    const note = document.getElementById('note');
    const kanjiNaku = document.getElementById('kanji-naku');
    const charJo = document.getElementById('char-jo');
    const charOnna = document.getElementById('char-onna');
    const charKuchi = document.getElementById('char-kuchi');
    const resultText = document.getElementById('result-text');

    let gameActive = true;
    let timerId;

    // 家康タイマーの開始
    function startIeyasuTimer() {
        timerId = setTimeout(() => {
            if (!gameActive) return;
            gameActive = false;
            note.classList.add('singing');
            showResult("あなたは家康タイプ！");
        }, WAIT_TIME);
    }
    startIeyasuTimer();

    // 結果表示関数
    function showResult(text) {
        resultText.innerText = text;
        resultText.style.opacity = 1;
        sword.style.visibility = 'hidden'; 
    }

    // 重なり判定関数
    function isColliding(el1, el2) {
        const rect1 = el1.getBoundingClientRect();
        const rect2 = el2.getBoundingClientRect();
        // 判定を少し甘くする（中心付近でのみ判定）
        const padding = 20;
        return !(
            rect1.top + padding > rect2.bottom ||
            rect1.right - padding < rect2.left ||
            rect1.bottom - padding < rect2.top ||
            rect1.left + padding > rect2.right
        );
    }

    // ドラッグ＆ドロップ機能（ワープしないように修正）
    function makeDraggable(element, onDrop) {
        let currentX = 0, currentY = 0;
        let initialX, initialY;
        let isDragging = false;
        
        element.addEventListener('pointerdown', (e) => {
            if (!gameActive) return;
            isDragging = true;
            element.setPointerCapture(e.pointerId);
            
            // クリックした位置と現在の移動量の差分を記録
            initialX = e.clientX - currentX;
            initialY = e.clientY - currentY;
            
            element.style.transform = `translate(${currentX}px, ${currentY}px) scale(1.2)`;
            element.style.zIndex = 1000;
        });

        element.addEventListener('pointermove', (e) => {
            if (!isDragging || !gameActive) return;
            
            // 新しい位置を計算
            currentX = e.clientX - initialX;
            currentY = e.clientY - initialY;
            
            // translateを使って移動させる（画面ワープ防止）
            element.style.transform = `translate(${currentX}px, ${currentY}px) scale(1.2)`;
        });

        element.addEventListener('pointerup', (e) => {
            if (!isDragging) return;
            isDragging = false;
            element.releasePointerCapture(e.pointerId);
            
            element.style.transform = `translate(${currentX}px, ${currentY}px) scale(1)`;
            if (gameActive && onDrop) {
                onDrop(element);
            }
        });
    }

    // 刀のドラッグ設定
    makeDraggable(sword, (draggedElement) => {
        // 1. ホトトギスを斬る（信長）
        if (isColliding(draggedElement, bird)) {
            gameActive = false;
            clearTimeout(timerId);
            
            birdWhole.style.display = 'none';
            birdL.style.display = 'block';
            birdR.style.display = 'block';
            
            setTimeout(() => {
                birdL.classList.add('cut-left');
                birdR.classList.add('cut-right');
            }, 50);

            showResult("あなたは信長タイプ！");
        }
        
        // 2. 「如」を斬る（秀吉への準備）
        else if (charJo.style.display !== 'none' && isColliding(draggedElement, charJo)) {
            charJo.style.display = 'none';
            charOnna.style.display = 'inline-block';
            charKuchi.style.display = 'inline-block';
            
            setTimeout(() => {
                charOnna.style.transform = 'translateX(-15px) rotate(-15deg)';
                charKuchi.style.transform = 'translateX(15px) rotate(15deg)';
            }, 50);

            // 分割された「口」をドラッグ可能にする
            makeDraggable(charKuchi, (draggedKuchi) => {
                if (isColliding(draggedKuchi, bird)) {
                    gameActive = false;
                    clearTimeout(timerId);
                    
                    draggedKuchi.style.display = 'none';
                    bird.style.display = 'none';
                    kanjiNaku.style.display = 'block';
                    
                    showResult("あなたは秀吉タイプ！");
                }
            });
        }
    });

</script>
</body>
</html>
