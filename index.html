<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>不如帰診断</title>
<style>
    body {
        font-family: 'Hiragino Mincho ProN', 'Yu Mincho', serif;
        background-color: #fdfaf5;
        color: #333;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        gap: 20px;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
    }

    #title-area {
        font-size: 42px;
        font-weight: bold;
        text-align: center;
        z-index: 10;
        background: #2c3e50;
        color: #fdfdfd;
        padding: 8px 40px 15px;
        border: 2px solid #d4af37;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
        position: relative;
        margin-bottom: 15px;
        line-height: 1.2;
    }
    #title-area::before {
        content: '';
        position: absolute;
        top: 4px; left: 4px; right: 4px; bottom: 4px;
        border: 1px solid #d4af37;
        border-radius: 4px;
        pointer-events: none;
    }
    
    ruby { ruby-position: over; }
    
    #char-jo-wrapper { 
        position: relative; 
        display: inline-block; 
    }
    
    #char-onna, #char-kuchi {
        display: none;
        position: absolute;
        bottom: 0;
        transition: transform 0.5s;
    }
    #char-onna { left: 0; }
    
    #char-kuchi { 
        left: 50%;
        cursor: grab;
        z-index: 100;
    }
    #char-kuchi:active { cursor: grabbing; }

    #char-kuchi::after {
        content: '';
        position: absolute;
        top: -20px; left: -20px; right: -20px; bottom: -20px;
    }

    #center-area {
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
    }
    #bird {
        position: relative;
        width: 180px;
        height: 180px;
    }
    
    .bird-svg-container {
        width: 100%; height: 100%;
        pointer-events: none;
    }
    .bird-part {
        position: absolute; top: 0; left: 0;
        transition: transform 0.6s ease-out;
    }
    
    .bird-left { clip-path: polygon(0 0, 50% 0, 50% 100%, 0 100%); }
    .bird-right { clip-path: polygon(50% 0, 100% 0, 100% 100%, 50% 100%); }
    .cut-left { transform: translateX(-50px) rotate(-15deg); }
    .cut-right { transform: translateX(50px) rotate(15deg); }

    .singing-bird .beak-closed { display: none !important; }
    .singing-bird .beak-open { display: block !important; }

    #note {
        position: absolute;
        font-size: 16px;
        font-weight: bold;
        color: #ff4081;
        background: rgba(255, 255, 255, 0.95);
        border: 2px solid #ff4081;
        padding: 6px 10px;
        border-radius: 20px;
        top: -10px; right: -50px;
        opacity: 0;
        transition: opacity 0.5s, transform 0.5s;
        white-space: nowrap;
        box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    #note::after {
        content: ''; position: absolute;
        bottom: -8px; left: 20px;
        border-width: 8px 8px 0;
        border-style: solid;
        border-color: #ff4081 transparent transparent transparent;
        display: block; width: 0;
    }
    .singing {
        opacity: 1 !important;
        transform: translateY(-10px) rotate(5deg);
    }

    #kanji-naku {
        display: none;
        font-size: 140px;
        font-weight: bold;
        background: linear-gradient(to bottom, #d4af37, #b8860b);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-shadow: 2px 2px 10px rgba(212, 175, 55, 0.4);
    }

    @keyframes combineAnim {
        0% { transform: scale(0.2); opacity: 0; filter: brightness(2); }
        60% { transform: scale(1.1); filter: brightness(1.5); }
        100% { transform: scale(1); opacity: 1; filter: brightness(1); }
