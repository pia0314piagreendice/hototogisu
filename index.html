<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>不如帰診断</title>
<style>
    body {
        font-family: 'Hiragino Mincho ProN', 'Yu Mincho', serif;
        background-color: #fdfaf5;
        color: #333;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        /* 画面が崩れても白紙にならないよう安全な高さ指定に変更 */
        min-height: 100vh;
        margin: 0;
        padding: 3vh 15px 4vh;
        box-sizing: border-box;
        overflow-x: hidden;
        overflow-y: auto;
        user-select: none;
        -webkit-user-select: none;
        touch-action: manipulation;
    }

    #title-area {
        flex-shrink: 0;
        font-size: 52px; 
        font-weight: bold;
        text-align: center;
        z-index: 10;
        background: #2c3e50;
        color: #fdfdfd;
        padding: 10px 50px 18px;
        border: 2px solid #d4af37;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
        position: relative;
        line-height: 1.2;
    }
    #title-area::before {
        content: '';
        position: absolute;
        top: 4px; left: 4px; right: 4px; bottom: 4px;
        border: 1px solid #d4af37;
        border-radius: 4px;
        pointer-events: none;
    }
    
    ruby { ruby-position: over; }
    
    #char-jo-wrapper { 
        position: relative; 
        display: inline-block; 
    }
    
    #char-onna, #char-kuchi {
        display: none;
        position: absolute;
        bottom: 0;
        transition: transform 0.5s;
    }
    #char-onna { left: 0; }
    
    #char-kuchi { 
        left: 50%;
        cursor: grab;
        z-index: 100;
        touch-action: none;
    }
    #char-kuchi:active { cursor: grabbing; }
    #char-kuchi::after {
        content: '';
        position: absolute;
        top: -20px; left: -20px; right: -20px; bottom: -20px;
    }

    #center-area {
        flex-grow: 1;
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
    }
    
    #bird {
        position: relative;
        width: 260px;
        height: 260px;
    }
    
    .bird-svg-container {
        width: 100%; height: 100%;
        pointer-events: none;
    }
    .bird-part {
        position: absolute; top: 0; left: 0;
        transition: transform 0.6s ease-out;
    }
    
    .bird-left { clip-path: polygon(0 0, 50% 0, 50% 100%, 0 100%); }
    .bird-right { clip-path: polygon(50% 0, 100% 0, 100% 100%, 50% 100%); }
    .cut-left { transform: translateX(-60px) rotate(-15deg); }
    .cut-right { transform: translateX(60px) rotate(15deg); }

    .singing-bird .beak-closed { display: none !important; }
    .singing-bird .beak-open { display: block !important; }

    #note {
        position: absolute;
        font-size: 22px; 
        font-weight: bold;
        color: #ff4081;
        background: rgba(255, 255, 255, 0.95);
        border: 2px solid #ff4081;
        padding: 8px 14px;
        border-radius: 24px;
        top: -15px; right: -80px;
        opacity: 0;
        transition: opacity 0.5s, transform 0.5s;
        white-space: nowrap;
        box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    #note::after {
        content: ''; position: absolute;
        bottom: -10px; left: 25px;
        border-width: 10px 10px 0;
        border-style: solid;
        border-color: #ff4081 transparent transparent transparent;
        display: block; width: 0;
    }
    .singing {
        opacity: 1 !important;
        transform: translateY(-10px) rotate(5deg);
    }

    #kanji-naku {
        display: none;
        font-size: 200px; 
        font-weight: bold;
        background: linear-gradient(to bottom, #d4af37, #b8860b);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-shadow: 2px 2px 10px rgba(212, 175, 55, 0.4);
    }

    @keyframes combineAnim {
        0% { transform: scale(0.2); opacity: 0; filter: brightness(2); }
        60% { transform: scale(1.1); filter: brightness(1.5); }
        100% { transform: scale(1); opacity: 1; filter: brightness(1); }
    }

    #bottom-area {
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        z-index: 50;
    }
    
    #sword {
        width: 130px;
        height: 130px;
        cursor: grab;
        position: relative;
        z-index: 200;
        padding: 5px;
        transition: opacity 0.3s;
        touch-action: none;
    }
    #sword:active { cursor: grabbing; }

    #reset-btn {
        padding: 12px 35px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        background-color: #4a4a4a;
        color: white;
        border: 2px solid #333;
        border-radius: 6px;
        box-shadow: 0 3px 5px rgba(0,0,0,0.3);
        transition: transform 0.1s;
    }
    #reset-btn:active { transform: scale(0.95); }

    #result-modal {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.6);
        display: flex;
        justify-content: center; align-items: center;
        z-index: 1000;
        opacity: 0; pointer-events: none;
        transition: opacity 0.3s ease;
    }
    #result-modal.show {
        opacity: 1; pointer-events: auto;
    }
    
    .modal-content {
        background: #fdfaf5;
        padding: 30px 40px;
        border-radius: 12px;
        text-align: center;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        border: 4px solid #d4af37;
        transform: scale(0.8);
        transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    #result-modal.show .modal-content { transform: scale(1); }
    .modal-title-text { font-size: 18px; color: #555; margin-bottom: 10px; }
    
    #modal-text {
        font-size: 32px;
        font-weight: bold;
        color: #d32f2f;
        margin-bottom: 25px;
        text-shadow: 1px 1px 3px rgba(0,0,0,0.2);
    }

    .modal-buttons {
        display: flex;
        justify-content: center;
        gap: 15px;
        margin-top: 10px;
    }
    #share-x-btn {
        background: #000; color: #fff;
        border: none; padding: 10px 20px;
        font-size: 16px; font-weight: bold;
        border-radius: 6px; cursor: pointer;
        box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        transition: transform 0.1s;
    }
    #share-x-btn:active { transform: scale(0.95); }
    #modal-close-btn {
        background: #2c3e50; color: #fff;
        border: none; padding: 10px 25px;
        font-size: 16px; font-weight: bold;
        border-radius: 6px; cursor: pointer;
        box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        transition: transform 0.1s;
    }
    #modal-close-btn:active { transform: scale(0.95); }

    @media screen and (max-width: 768px) {
        body { padding: 2vh 10px 3vh; }
        #title-area {
            font-size: 38px; 
            padding: 8px 10px 12px; 
            width: 95%; 
            box-sizing: border-box;
        }
        #bird { width: 220px; height: 220px; }
        #note { font-size: 18px; right: -40px; }
        #kanji-naku { font-size: 160px; }
        #bottom-area { gap: 15px; }
        #sword { width: 110px; height: 110px; }
        #reset-btn { padding: 12px 30px; }
        .modal-buttons { flex-direction: column; gap: 10px; }
    }
</style>
</head>
