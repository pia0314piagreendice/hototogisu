<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>不如帰診断</title>
<style>
    body {
        font-family: 'Hiragino Mincho ProN', 'Yu Mincho', serif;
        background-color: #fdfaf5;
        color: #333;
        display: flex;
        flex-direction: column;
        align-items: center;
        height: 100vh;
        margin: 0;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none; /* スマホでのスワイプスクロールを防止 */
    }

    /* 上部：タイトル */
    #title-area {
        margin-top: 10vh;
        font-size: 32px;
        font-weight: bold;
        text-align: center;
        z-index: 10;
    }
    ruby {
        ruby-position: over;
    }
    #char-jo-wrapper {
        position: relative;
        display: inline-block;
    }
    #char-jo {
        display: inline-block;
    }
    
    /* 切られた後の「女」と「口」 */
    #char-onna, #char-kuchi {
        display: none;
        position: absolute;
        top: 0;
        transition: transform 0.5s;
    }
    #char-onna { left: 0; }
    #char-kuchi { 
        left: 50%;
        cursor: grab;
        z-index: 100;
        color: #d32f2f;
        padding: 20px;
        margin: -20px; /* ドラッグしやすくするための余白 */
    }
    #char-kuchi:active { cursor: grabbing; }

    /* 中央：ホトトギスエリア */
    #center-area {
        flex-grow: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        width: 100%;
    }
    #bird {
        position: relative;
        width: 220px;
        height: 220px;
    }
    
    /* 鳥のSVGコンテナ */
    .bird-svg-container {
        width: 100%;
        height: 100%;
        pointer-events: none;
    }
    .bird-part {
        position: absolute;
        top: 0;
        left: 0;
        transition: transform 0.6s ease-out, opacity 0.6s;
    }
    
    /* ホトトギスを左右に分割するクリップパス */
    .bird-left { clip-path: polygon(0 0, 50% 0, 50% 100%, 0 100%); }
    .bird-right { clip-path: polygon(50% 0, 100% 0, 100% 100%, 50% 100%); }
    .cut-left { transform: translateX(-60px) rotate(-15deg); opacity: 0; }
    .cut-right { transform: translateX(60px) rotate(15deg); opacity: 0; }

    /* 鳴き声とクチバシの開閉設定 */
    .singing-bird .beak-closed { display: none !important; }
    .singing-bird .beak-open { display: block !important; }

    #note {
        position: absolute;
        font-size: 18px;
        font-weight: bold;
        color: #ff4081;
        background: rgba(255, 255, 255, 0.95);
        border: 2px solid #ff4081;
        padding: 8px 12px;
        border-radius: 20px;
        top: 0px;
        right: -60px;
        opacity: 0;
        transition: opacity 0.5s, transform 0.5s;
        white-space: nowrap;
        box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    #note::after {
        content: '';
        position: absolute;
        bottom: -8px;
        left: 20px;
        border-width: 8px 8px 0;
        border-style: solid;
        border-color: #ff4081 transparent transparent transparent;
        display: block;
        width: 0;
    }
    .singing {
        opacity: 1 !important;
        transform: translateY(-15px) rotate(5deg);
    }

    #kanji-naku {
        display: none;
        font-size: 120px;
        font-weight: bold;
        color: #333;
        text-shadow: 2px 2px 5px rgba(0,0,0,0.2);
    }

    /* 下部：刀とリセットボタン */
    #bottom-area {
        position: absolute;
        bottom: 5vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        width: 100%;
        z-index: 50;
    }
    #sword {
        width: 160px;
        height: 160px;
        cursor: grab;
        position: relative;
        z-index: 200;
        padding: 20px; 
        margin: -20px;
    }
    #sword:active {
        cursor: grabbing;
    }

    #reset-btn {
        padding: 12px 30px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        background-color: #555;
        color: white;
        border: none;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        transition: background-color 0.2s, transform 0.1s;
    }
    #reset-btn:active { transform: scale(0.95); }

    /* 結果表示 */
    #result-text {
        position: absolute;
        top: 30%;
        font-size: 36px;
        font-weight: bold;
        color: #d32f2f;
        opacity: 0;
        transition: opacity 1s;
        pointer-events: none;
        text-shadow: 2px 2px 5px rgba(255,255,255,0.9), 0 0 10px rgba(255,255,255,0.9);
        z-index: 300;
        width: 100%;
        text-align: center;
    }
</style>
</head>
<body>

    <div id="title-area">
        <ruby>不<rt>ホト</rt></ruby><span id="char-jo-wrapper"><span id="char-jo"><ruby>如<rt>トギ</rt></ruby></span><span id="char-onna">女</span><span id="char-kuchi">口</span></span><ruby>帰<rt>ス</rt></ruby>診断
    </div>

    <div id="center-area">
        <div id="bird">
            <div id="bird-whole" class="bird-svg-container"></div>
            <div id="bird-l" class="bird-svg-container bird-part bird-left" style="display:none;"></div>
            <div id="bird-r" class="bird-svg-container bird-part bird-right" style="display:none;"></div>
            <div id="note">ホーホケキョ♪</div>
        </div>
        <div id="kanji-naku">鳴</div>
    </div>

    <div id="result-text"></div>

    <div id="bottom-area">
        <div id="sword">
            <!-- リアルな日本刀（打刀）のベクターイラスト -->
            <svg viewBox="0 0 200 200" width="100%" height="100%" style="filter: drop-shadow(4px 4px 5px rgba(0,0,0,0.4));">
                <defs>
                    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#f8f9fa"/>
                        <stop offset="40%" stop-color="#ced4da"/>
                        <stop offset="100%" stop-color="#6c757d"/>
                    </linearGradient>
                </defs>
                <g transform="rotate(-35 100 100)">
                    <!-- 柄頭（かしら） -->
                    <rect x="18" y="92" width="8" height="16" rx="3" fill="#212529" stroke="#d4af37" stroke-width="1"/>
                    
                    <!-- 柄（つか）と鮫肌（さめがわ） -->
                    <rect x="25" y="93" width="45" height="14" fill="#f8f9fa"/>
                    <circle cx="30" cy="96" r="0.8" fill="#333"/><circle cx="35" cy="104" r="0.8" fill="#333"/><circle cx="40" cy="98" r="0.8" fill="#333"/><circle cx="50" cy="95" r="0.8" fill="#333"/><circle cx="55" cy="103" r="0.8" fill="#333"/>
                    
                    <!-- 柄巻（つかまき：菱形の紐飾り） -->
                    <path d="M 25 93 L 32 100 L 25 107 M 32 93 L 39 100 L 32 107 M 39 93 L 46 100 L 39 107 M 46 93 L 53 100 L 46 107 M 53 93 L 60 100 L 53 107 M 60 93 L 67 100 L 60 107" stroke="#212529" stroke-width="2" fill="none"/>
                    <path d="M 25 107 L 32 100 L 25 93 M 32 107 L 39 100 L 32 93 M 39 107 L 46 100 L 39 93 M 46 107 L 53 100 L 46 93 M 53 107 L 60 100 L 53 93 M 60 107 L 67 100 L 60 93" stroke="#212529" stroke-width="2" fill="none"/>
                    
                    <!-- 鍔（つば） -->
                    <rect x="68" y="84" width="5" height="32" rx="2" fill="#212529" stroke="#d4af37" stroke-width="1.5"/>
                    
                    <!-- 鎺（はばき：刀身の根本の金具） -->
                    <rect x="73" y="93" width="10" height="14" fill="#d4af37"/>
                    <line x1="75" y1="93" x2="81" y2="107" stroke="#b5952f" stroke-width="1"/>
                    <line x1="78" y1="93" x2="83" y2="107" stroke="#b5952f" stroke-width="1"/>
                    
                    <!-- 刀身（反りのある美しい刃） -->
                    <path d="M 83 106 Q 140 114 185 98 C 188 95 186 92 180 90 Q 140 76 83 94 Z" fill="url(#bladeGrad)"/>
                    
                    <!-- 刃文（はもん：波打つ模様） -->
                    <path d="M 83 101 Q 95 96 105 103 T 125 98 T 145 102 T 165 94 T 182 93" stroke="#ffffff" stroke-width="2.5" fill="none" opacity="0.8"/>
                    
                    <!-- 鎬（しのぎ：刀身の稜線） -->
                    <path d="M 83 99 Q 140 90 182 92" stroke="#adb5bd" stroke-width="1" fill="none"/>
                </g>
            </svg>
        </div>
        <button id="reset-btn" onclick="location.reload()">リセット</button>
    </div>

<script>
    // ===== ゲーム設定 =====
    const WAIT_TIME = 120000; // 2分 (テスト時は5000などに変更してください)

    // ===== リアルなホトトギスのベクターイラスト生成 =====
    // ※灰色と白のコントラスト、お腹の縞模様、黄色いアイリングが特徴です
    const birdSVG = `
    <svg viewBox="0 0 200 200" width="100%" height="100%">
        <defs>
            <clipPath id="birdClip">
                <path d="M 45 80 C 50 45, 80 40, 100 50 C 120 60, 140 80, 155 95 C 130 135, 80 150, 45 125 C 30 110, 35 90, 45 80 Z" />
            </clipPath>
        </defs>
        
        <!-- 尾羽 -->
        <path d="M 140 90 L 195 115 L 185 130 L 130 110 Z" fill="#444d56"/>
        <path d="M 145 100 L 195 125 L 185 135 L 135 115 Z" fill="#363c43"/>
        
        <!-- 足 -->
        <path d="M 80 140 L 75 170 L 65 175 M 75 170 L 85 175" stroke="#d49a2a" stroke-width="3" fill="none" stroke-linecap="round"/>
        <path d="M 100 135 L 95 165 L 85 170 M 95 165 L 105 170" stroke="#d49a2a" stroke-width="3" fill="none" stroke-linecap="round"/>
        
        <!-- お腹のベース（白） -->
        <path d="M 45 80 C 50 45, 80 40, 100 50 C 120 60, 140 80, 155 95 C 130 135, 80 150, 45 125 C 30 110, 35 90, 45 80 Z" fill="#ffffff"/>
        
        <!-- ホトトギスの特徴的なお腹の縞模様 -->
        <g clip-path="url(#birdClip)">
            <path d="M 30 95 Q 80 120 150 95" stroke="#333" stroke-width="2.5" fill="none"/>
            <path d="M 30 105 Q 80 130 150 105" stroke="#333" stroke-width="2.5" fill="none"/>
            <path d="M 30 115 Q 80 140 150 115" stroke="#333" stroke-width="2.5" fill="none"/>
            <path d="M 30 125 Q 80 150 150 125" stroke="#333" stroke-width="2.5" fill="none"/>
            <path d="M 40 135 Q 80 160 140 135" stroke="#333" stroke-width="2.5" fill="none"/>
        </g>
        
        <!-- 背中と頭（灰色） -->
        <path d="M 45 80 C 50 45, 80 40, 100 50 C 120 60, 140 80, 155 95 C 130 90, 90 85, 45 80 Z" fill="#6c7782"/>
        
        <!-- 翼 -->
        <path d="M 90 75 C 110 75, 135 95, 150 120 C 125 110, 100 95, 90 75 Z" fill="#525b64"/>
        
        <!-- 黄色いアイリングと目 -->
        <circle cx="60" cy="65" r="3.5" fill="#111"/>
        <circle cx="60" cy="65" r="5" fill="none" stroke="#f1c40f" stroke-width="2"/>
        
        <!-- クチバシ（閉） -->
        <path class="beak-closed" d="M 45 72 L 15 76 L 45 82 Z" fill="#333"/>
        
        <!-- クチバシ（開） -->
        <path class="beak-open" d="M 45 72 L 15 62 L 38 75 Z M 45 82 L 15 92 L 40 80 Z" fill="#333" style="display:none;"/>
        <path class="beak-open" d="M 38 75 L 15 77 L 40 80 Z" fill="#c0392b" style="display:none;"/> <!-- 口の中 -->
    </svg>
    `;
    
    // 鳥のイラストを要素に流し込む
    document.getElementById('bird-whole').innerHTML = birdSVG;
    document.getElementById('bird-l').innerHTML = birdSVG;
    document.getElementById('bird-r').innerHTML = birdSVG;

    // ===== ゲームロジック =====
    const sword = document.getElementById('sword');
    const bird = document.getElementById('bird');
    const birdWhole = document.getElementById('bird-whole');
    const birdL = document.getElementById('bird-l');
    const birdR = document.getElementById('bird-r');
    const note = document.getElementById('note');
    const kanjiNaku = document.getElementById('kanji-naku');
    const charJo = document.getElementById('char-jo');
    const charOnna = document.getElementById('char-onna');
    const charKuchi = document.getElementById('char-kuchi');
    const resultText = document.getElementById('result-text');

    let gameActive = true;
    let timerId;

    // 家康タイマー
    function startIeyasuTimer() {
        timerId = setTimeout(() => {
            if (!gameActive) return;
            gameActive = false;
            birdWhole.classList.add('singing-bird');
            note.classList.add('singing');
            showResult("あなたは家康タイプ！");
        }, WAIT_TIME);
    }
    startIeyasuTimer();

    function showResult(text) {
        resultText.innerText = text;
        resultText.style.opacity = 1;
        sword.style.visibility = 'hidden'; 
    }

    function isColliding(el1, el2) {
        const rect1 = el1.getBoundingClientRect();
        const rect2 = el2.getBoundingClientRect();
        const padding = 20;
        return !(
            rect1.top + padding > rect2.bottom ||
            rect1.right - padding < rect2.left ||
            rect1.bottom - padding < rect2.top ||
            rect1.left + padding > rect2.right
        );
    }

    // ドラッグ＆ドロップ機能
    function makeDraggable(element, onDrop) {
        let currentX = 0, currentY = 0;
        let initialX, initialY;
        let isDragging = false;
        
        element.addEventListener('pointerdown', (e) => {
            if (!gameActive) return;
            isDragging = true;
            element.setPointerCapture(e.pointerId);
            element.style.transition = 'none';

            initialX = e.clientX - currentX;
            initialY = e.clientY - currentY;
            
            element.style.transform = `translate(${currentX}px, ${currentY}px) scale(1.1)`;
            element.style.zIndex = 1000;
        });

        element.addEventListener('pointermove', (e) => {
            if (!isDragging || !gameActive) return;
            currentX = e.clientX - initialX;
            currentY = e.clientY - initialY;
            element.style.transform = `translate(${currentX}px, ${currentY}px) scale(1.1)`;
        });

        element.addEventListener('pointerup', (e) => {
            if (!isDragging) return;
            isDragging = false;
            element.releasePointerCapture(e.pointerId);
            element.style.transition = '';
            element.style.transform = `translate(${currentX}px, ${currentY}px) scale(1)`;
            if (gameActive && onDrop) {
                onDrop(element);
            }
        });
    }

    // 刀のドラッグ設定
    makeDraggable(sword, (draggedElement) => {
        // 1. 信長ルート（鳥を斬る）
        if (isColliding(draggedElement, bird)) {
            gameActive = false;
            clearTimeout(timerId);
            
            birdWhole.style.display = 'none';
            birdL.style.display = 'block';
            birdR.style.display = 'block';
            
            setTimeout(() => {
                birdL.classList.add('cut-left');
                birdR.classList.add('cut-right');
            }, 50);

            showResult("あなたは信長タイプ！");
        }
        
        // 2. 秀吉ルートの準備（「如」を斬る）
        else if (charJo.style.display !== 'none' && isColliding(draggedElement, charJo)) {
            charJo.style.display = 'none';
            charOnna.style.display = 'inline-block';
            charKuchi.style.display = 'inline-block';
            
            setTimeout(() => {
                charOnna.style.transform = 'translateX(-15px) rotate(-15deg)';
                charKuchi.style.transform = 'translateX(15px) rotate(15deg)';
            }, 50);

            // 分割された「口」をドラッグ可能にする
            makeDraggable(charKuchi, (draggedKuchi) => {
                // 口を鳥に重ねる
                if (isColliding(draggedKuchi, bird)) {
                    gameActive = false;
                    clearTimeout(timerId);
                    
                    draggedKuchi.style.display = 'none';
                    bird.style.display = 'none';
                    kanjiNaku.style.display = 'block';
                    
                    showResult("あなたは秀吉タイプ！");
                }
            });
        }
    });
</script>
</body>
</html>
